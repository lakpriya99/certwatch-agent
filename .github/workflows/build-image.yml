name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest (excluding network tests)
        # The badssl integration tests in test_cert_check.py are marked
        # `network` and require live internet access. CI skips them so
        # the image build doesn't depend on third-party uptime.
        run: pytest -m "not network" -q

  build-and-push:
    name: build & push to ghcr.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract package version
        id: version
        run: |
          VERSION=$(python -c "from certwatch._version import __version__; print(__version__)")
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from certwatch/_version.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute lower-case repo owner
        # ghcr.io requires lower-case namespace; GitHub orgs/users that
        # use camelCase break the docker push without this.
        id: owner
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/certwatch-agent:latest
            ghcr.io/${{ steps.owner.outputs.name }}/certwatch-agent:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/certwatch-agent:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache build layers across runs so dep installs don't repeat
          # for source-only changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
